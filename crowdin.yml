# Crowdin sync for app text. Spec: specs/017-app-text-translation/spec.md (Q4).
# Task: https://github.com/ItsCalebJones/SpaceLaunchNow-Tasks/issues/1217
#
# Secrets stay out of this file. Set CROWDIN_PROJECT_ID and CROWDIN_PERSONAL_TOKEN
# in the environment or as CI secrets. The CLI reads them as project_id_env and api_token_env.
project_id_env: CROWDIN_PROJECT_ID
api_token_env: CROWDIN_PERSONAL_TOKEN
base_path: .
preserve_hierarchy: true
# %android_code% can give es-rES; the repo folders are values-es, values-pt-rBR, values-zh-rCN.
languages_mapping:
  android_code:
    es: es
    pt-BR: pt-rBR
    zh-CN: zh-rCN

files:
  # Compose Multiplatform resources (shared UI). Android XML format.
  # The glob takes every values/*.xml (strings.xml, strings_time.xml, later files).
  # Crowdin writes values-<android_code>/<same file name>; Compose resources read the same folders.
  - source: /composeApp/src/commonMain/composeResources/values/*.xml
    translation: /composeApp/src/commonMain/composeResources/values-%android_code%/%original_file_name%
    type: android
    # Do not overwrite a translation that a person approved with the model's first fill.
    update_option: update_as_unapproved
    # The app_roadmap_* keys are translatable="false" (Tasks#1329), so Crowdin skips them.

  # Android widgets and notifications (androidMain res). app_name and app_name_debug are translatable="false".
  - source: /composeApp/src/androidMain/res/values/strings.xml
    translation: /composeApp/src/androidMain/res/values-%android_code%/%original_file_name%
    type: android
    update_option: update_as_unapproved

  # Wear OS app. Same folder names as the phone app.
  - source: /wearApp/src/main/res/values/strings.xml
    translation: /wearApp/src/main/res/values-%android_code%/%original_file_name%
    type: android
    update_option: update_as_unapproved
