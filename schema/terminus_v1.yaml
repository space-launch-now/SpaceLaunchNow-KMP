  /api/v1/search/:
    get:
      operationId: search_list
      description: 'One query across launches, events, astronauts, rockets (launcher
        configurations), spacecraft, pads, agencies and programs: a count per type
        and the best `limit` items per type. `top` is an exact name match when there
        is one (program, rocket, spacecraft, astronaut, launch), else the next upcoming
        launch, else the most recent one. The crew of a matching launch joins `astronauts`
        with `via_launch` set to that launch. The answer is cached for 300 seconds.'
      summary: Search across resources
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
        description: Items per type, 1 to 10. Default 3.
      - in: query
        name: q
        schema:
          type: string
        description: The query, 2 to 100 characters.
        required: true
      - in: query
        name: types
        schema:
          type: string
        description: 'Comma list of: launches, events, astronauts, rockets, spacecraft,
          pads, agencies, programs. Default: all of them.'
      - in: query
        name: when
        schema:
          type: string
          enum:
          - any
          - past
          - upcoming
        description: Launches and events only. Default `any`.
      tags:
      - search
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
          description: ''
